<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 300 300">
  <defs>
    <!-- svg gradient -->
    <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%">
        <animate attributeName="stop-color" values="#0087ff; #9b5de5; #f15bb5; #00f5d4; #0087ff" dur="11s"
          repeatCount="indefinite" />
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color" values="#f15bb5; #00f5d4; #0087ff; #9b5de5; #f15bb5" dur="11s"
          repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- background track -->
  <circle cx="150" cy="150" r="132" fill="none" stroke="#ccc" stroke-width="16" />

  <!-- progress track -->
  <path d="M 150, 150 m 0, -132 a 132,132 0 0,1 0,264 a -132,-132 0 0,1 0,-264" fill="none"
    stroke="url(#progressGradient)" stroke-width="16" stroke-linecap="round" stroke-dasharray="829.3804605477054"
    stroke-dashoffset="197.42873492060545" transform="rotate(0 150 150)" />

  <!-- knob ring group (positioned using a unified transform group) -->
  <g transform="translate(0, 120)">
    <!-- outer glow circle (static representation of pulse) -->
    <circle cx="18" cy="18" r="16.2" fill="#48b400" fill-opacity="0.35" />

    <!-- main knob body with drop shadow -->
    <circle cx="18" cy="18" r="12" fill="#48b400" style="filter: drop-shadow(0px 1px 2px rgba(0, 0, 0, 0.5));" />

    <!-- knob grip lines -->
    <rect fill="#FFFFFF" x="14" y="14" width="8" height="1" />
    <rect fill="#FFFFFF" x="14" y="17" width="8" height="1" />
    <rect fill="#FFFFFF" x="14" y="20" width="8" height="1" />
  </g>
</svg>